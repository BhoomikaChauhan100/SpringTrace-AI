# -----------------------------------------------------------------------------
# SpringTrace AI - application configuration
# Keep secrets in environment variables; NEVER paste a real API key here.
# -----------------------------------------------------------------------------
spring.application.name=springtrace-ai
server.port=8080

# Database (H2 is the zero-setup default)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# BharatCode OpenAI-compatible Chat Completions API
bharatcode.enabled=${BHARATCODE_ENABLED:true}
bharatcode.base-url=https://bharatcode.ai/api/model/v1
bharatcode.chat-completions-path=/chat/completions
bharatcode.api-key=${BHARATCODE_API_KEY}
bharatcode.model=qwen-3.8-27b
bharatcode.connect-timeout=10s
bharatcode.read-timeout=90s
bharatcode.max-tokens=6000
bharatcode.temperature=0.2

# Local analyzer limits
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
