<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>History — SpringTrace</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="shell"><div th:replace="~{fragments :: nav}"></div><main class="container page-container">
<div class="page-title"><div class="eyebrow">YOUR ACTIVITY</div><h1>Analysis <span>history.</span></h1><p>Revisit your recent debugging sessions.</p></div><div th:if="${message}" class="notice" th:text="${message}"></div>
<div class="empty-state" th:if="${#lists.isEmpty(history)}"><div class="empty-icon">⌁</div><h3>Nothing here yet</h3><p>Once you run an analysis, it will show up here.</p><a class="btn primary" th:href="@{/debugger}">Start debugging →</a></div>
<div class="history-table" th:unless="${#lists.isEmpty(history)}"><div class="history-table-head"><span>ISSUE</span><span>INPUT PREVIEW</span><span>MODE</span><span>ACTION</span></div><div class="history-table-row" th:each="item : ${history}"><b th:text="${item.issueType}">AUTO</b><span th:text="${#strings.abbreviate(item.input,100)}">Input</span><span class="mode-pill" th:text="${item.mode}">LOCAL</span><form th:action="@{/history/{id}/delete(id=${item.id})}" method="post"><button class="delete-btn" type="submit" onclick="return confirm('Delete this analysis?')">Delete</button></form></div></div>
<footer>© 2026 SpringTrace AI <span>Built for developers, by developers.</span></footer></main></div><script th:src="@{/js/app.js}"></script></body></html>
